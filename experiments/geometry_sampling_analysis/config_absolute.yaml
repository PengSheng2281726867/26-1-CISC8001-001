schema_version: 1
project_config: configs/alt_pusht_base.yaml
split_manifest: experiments/splits/pusht_v7_split42.json
subset: '30'
expected_frames: 3806
distance:
  xy_scale: 512.0
  angle_scale: 3.141592653589793
  storage_dtype: float32
  computation_dtype: float64
  block_rows: 256
neighbors:
  top_k: [5, 10, 20]
  exclude_temporal_radius: 8
  pools: [all, exclude_local8, cross]
thresholds:
  calibration: fixed_absolute_sensitivity_supplement
  near_levels: [tight, middle, loose]
  far_levels: [moderate, strong]
  absolute_values:
    near:
      d_p: {tight: 10, middle: 20, loose: 40}
      d_T: {tight: 10, middle: 20, loose: 40}
      d_theta_degrees: {tight: 2, middle: 5, loose: 10}
    far:
      d_p: {moderate: 80, strong: 160}
      d_T: {moderate: 60, strong: 100}
      d_theta_degrees: {moderate: 20, strong: 40}
  inclusive_bounds: true
  hard_b_rule: pusher_close_AND_block_far_OR_angle_far_parenthesized
  profiles:
    strict: {near_level: tight, far_level: strong}
    primary: {near_level: middle, far_level: moderate}
    broad: {near_level: loose, far_level: moderate}
batch:
  size: 32
  anchors: 8
  similar: 8
  hard_a: 4
  hard_b: 4
  random: 8
  repeats: 100
  anchor_seed: 20261021
  candidate_seed: 20261022
  baseline_seed: 20261023
  uniqueness: [allow_repeated, unique_frames]
  failure_policy: leave_slot_empty_no_anchor_resampling_no_threshold_relaxation_no_backfill
  reference: uniform_random_32_without_replacement_with_same_first_8_anchors
figures:
  example_seed: 20261024
  example_anchors: 3
  profile: primary
  pool: cross
statistics:
  quantiles: [0.01, 0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95, 0.99]
  histogram_bins: 64
notes: >-
  Full supplementary absolute grid declared after observing only component
  distance distributions: quantile-based pusher-close levels45.7/66.6/98.1
  were relatively loose. This supplement tests10/20/40-world-unit radii and
  2/5/10-degree angular radii; all57 conditions and all simulations are kept.
  It does not replace the original quantile analysis or tune a policy.
  No training, validation/test state candidates, or action labels are used.
